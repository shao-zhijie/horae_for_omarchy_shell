name: Validate Plugin

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json format
        run: |
          jq . manifest.json > /dev/null
          jq -e '.schemaVersion == 1' manifest.json
          jq -e '.kinds | index("bar-widget") != null' manifest.json
          jq -e '.entryPoints.barWidget == "BarWidget.qml"' manifest.json
          test -f BarWidget.qml
          test -f README.md
          test -f LICENSE
          test -f preview.png
